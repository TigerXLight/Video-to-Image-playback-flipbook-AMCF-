[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amcf-public-workflow"
version = "0.1.0"
description = "AMCF digital workflow and software-control research package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = [
  "numpy",
  "Pillow",
  "opencv-python",
  "scikit-image",
  "scipy",
  "imageio",
  "networkx",
  "tifffile",
  "lazy-loader",
]
device = [
  "Pillow",
  "pyserial",
  "pywin32; sys_platform == 'win32'",
  "twain; sys_platform == 'win32'",
  "hidapi; sys_platform == 'win32'",
]

[project.scripts]
amcf = "amcf_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "amcf_adaptive_component_scheduler",
  "amcf_archive_writer_reader",
  "amcf_cli",
  "amcf_component_event_archive",
  "amcf_component_event_viewer",
  "amcf_component_ffv1_temporal",
  "amcf_component_size_ceiling",
  "amcf_cross_corridor_reporting",
  "amcf_cross_corridor_roundtrip",
  "amcf_deliverable_package",
  "amcf_diagnostic_profiles",
  "amcf_diagnostic_state",
  "amcf_deep_semantic_inference",
  "amcf_hoot_level5_inference",
  "amcf_digital_encoder",
  "amcf_digital_validator",
  "amcf_full_workspace_parity_ledger",
  "amcf_local_main_archive_decode_check",
  "amcf_local_main_strict_parity",
  "amcf_local_main_test02",
  "amcf_local_main_tracking_test03a",
  "amcf_local_tests_progression_integration_ledger",
  "amcf_material_coupon_analysis",
